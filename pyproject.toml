[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superforge-unified"
version = "1.0.0"
description = "Unified auditable manufacturing operating system"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0,<4.0",
  "waitress>=3.0,<4.0",
  "openpyxl>=3.1,<4.0",
  "PyMuPDF>=1.24,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
build = ["pyinstaller>=6.0,<7.0"]

[tool.setuptools.packages.find]
include = ["superforge*", "modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"modules.ez_methods" = ["schema.sql", "examples/*.json"]
