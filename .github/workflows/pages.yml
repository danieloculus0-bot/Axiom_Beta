name: Axiom Browser Lab Verification
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  verify-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/engine.test.mjs web/ewi/engine.test.mjs web/erp/engine.test.mjs web/erp/pm.test.mjs web/erp/navigation.test.mjs web/erp/reports.test.mjs web/erp/context-actions.test.mjs
      - run: node --check web/erp/app.mjs && node --check web/ewi/app.mjs && node --check web/erp/pm-view.mjs && node --check web/erp/navigation-ui.mjs && node --check web/erp/reports.mjs && node --check web/erp/context-ui.mjs && node --check web/erp/context-actions.mjs
      - name: Assert source files and synthetic boundary are present
        run: |
          test -s web/index.html
          test -s web/engine.mjs
          test -s web/ewi/index.html
          test -s web/ewi/app.mjs
          test -s web/ewi/engine.mjs
          test -s web/erp/index.html
          test -s web/erp/app.mjs
          test -s web/erp/engine.mjs
          test -s web/erp/pm.mjs
          test -s web/erp/pm-view.mjs
          test -s web/erp/navigation.mjs
          test -s web/erp/reports.mjs
          test -s web/erp/context-ui.mjs
          test -s web/erp/context-actions.mjs
          grep -q 'menu-search' web/erp/index.html
          grep -q 'PM Tracker' web/erp/navigation.mjs
          test -s web/lab/index.html
          grep -q 'FUNCTIONAL LOCAL DEMO' web/ewi/index.html
          grep -q 'JobBOSS²: not connected' web/ewi/index.html
          grep -q 'Interactive sample, not live ERP' web/lab/index.html
          grep -q 'No production approval implied' web/lab/index.html
          grep -q 'FUNCTIONAL FICTIONAL ERP' web/erp/index.html
          grep -q 'No enterprise server' web/erp/index.html

