name: Axiom Browser Lab Verification
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  verify-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/engine.test.mjs
      - name: Assert source files and synthetic boundary are present
        run: |
          test -s web/index.html
          test -s web/engine.mjs
          grep -q 'Interactive sample, not live ERP' web/index.html
          grep -q 'No production approval implied' web/index.html

