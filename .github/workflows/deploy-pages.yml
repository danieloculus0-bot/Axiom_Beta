name: Publish Axiom Connected ERP Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser demo logic
        run: node --test web/engine.test.mjs web/ewi/engine.test.mjs web/erp/engine.test.mjs web/erp/pm.test.mjs web/erp/navigation.test.mjs web/erp/reports.test.mjs web/erp/context-actions.test.mjs web/erp/requests.test.mjs web/erp/routing-edit.test.mjs
      - name: Validate browser module syntax
        run: node --check web/erp/app.mjs && node --check web/ewi/app.mjs && node --check web/erp/pm-view.mjs && node --check web/erp/navigation-ui.mjs && node --check web/erp/reports.mjs && node --check web/erp/context-ui.mjs && node --check web/erp/context-actions.mjs && node --check web/erp/request-view.mjs && node --check web/erp/requests.mjs && node --check web/erp/routing-edit.mjs && node --check web/erp/routing-view.mjs
      - name: Enable/configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Publish static site
        id: deploy
        uses: actions/deploy-pages@v4
