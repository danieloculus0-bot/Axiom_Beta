name: EZstimate / ForgeVault / Axiom / BEAN wiring
on:
  pull_request:
    paths:
      - "superforge/integrations/ezstimate_quote.py"
      - "superforge/schema_extensions.py"
      - "superforge/app.py"
      - "integration_tests/test_ezstimate_suite_wiring.py"
      - ".github/workflows/ezstimate-suite-wiring.yml"
  push:
    branches: [main]
    paths:
      - "superforge/integrations/ezstimate_quote.py"
      - "superforge/schema_extensions.py"
      - "superforge/app.py"
      - "integration_tests/test_ezstimate_suite_wiring.py"
      - ".github/workflows/ezstimate-suite-wiring.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-real-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/ForgeVault
          ref: e1156cdc6271822b73a4563a10e283b371753978
          path: forgevault-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/EZstimate
          ref: 645347727d5567a882dd0398f28980c6bb856e2f
          path: ezstimate-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 0110bc7214ac8e9b69e5b781293f1b04d372287b
          path: bean-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" -e "./forgevault-src[dev]" -e ./ezstimate-src psutil
      - name: Verify real PDM, quote math, Axiom review state and BEAN journal
        run: python -m pytest -q integration_tests/test_ezstimate_suite_wiring.py
