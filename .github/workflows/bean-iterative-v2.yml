name: BEAN v2 contextual tactic switches and genuine Q learning
on:
  push:
    branches: ['experiment/bean-iterative-scheduling-mutations-*']
    paths:
      - 'experiments/bean_iterative_search/engine_v2.py'
      - 'experiments/bean_iterative_search/run_v2.py'
      - 'tests/test_bean_iterative_v2.py'
      - '.github/workflows/bean-iterative-v2.yml'
  pull_request:
    paths:
      - 'experiments/bean_iterative_search/engine_v2.py'
      - 'experiments/bean_iterative_search/run_v2.py'
      - 'tests/test_bean_iterative_v2.py'
      - '.github/workflows/bean-iterative-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 2f29b30a92e064c11c57c67d46eb4fdb2dcf4e71
          path: bean-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify actual Q transitions, objective and frozen holdout on two OSes
        env:
          PYTHONPATH: bean-core
        run: python -m unittest discover -s tests -p test_bean_iterative_v2.py -v
  three-seed-v2:
    needs: cross-platform
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 2f29b30a92e064c11c57c67d46eb4fdb2dcf4e71
          path: bean-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Train 63000 contextual Q actions and compare 1200 new unseen cases
        env:
          PYTHONPATH: bean-core
        run: python experiments/bean_iterative_search/run_v2.py --episodes 3000 --holdout 400 --out v2-new-holdout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bean-v2-contextual-q-63000-exact-ledger
          path: v2-new-holdout/
          if-no-files-found: warn
