name: Axiom Linux Package

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,build]'

      - name: Test source
        run: python -m pytest -q

      - name: Build one-file Axiom
        run: |
          pyinstaller --noconfirm --clean --onefile --name Axiom --collect-all modules.ez_methods desktop.py
          test -x dist/Axiom

      - name: Smoke test frozen executable
        run: |
          export AXIOM_DATA_DIR="$RUNNER_TEMP/axiom-frozen-data"
          export AXIOM_NO_BROWSER=1
          export AXIOM_PORT=5061
          ./dist/Axiom > "$RUNNER_TEMP/axiom.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5061/health | grep -q '"Axiom"'; then ready=1; break; fi
            if ! kill -0 $pid 2>/dev/null; then cat "$RUNNER_TEMP/axiom.log"; exit 1; fi
            sleep 1
          done
          test "$ready" = "1"
          curl -fsS http://127.0.0.1:5061/payroll >/dev/null
          curl -fsS http://127.0.0.1:5061/accounting >/dev/null
          curl -fsS http://127.0.0.1:5061/sheets >/dev/null
          kill $pid
          wait $pid 2>/dev/null || true
          trap - EXIT

      - name: Build Linux install package
        run: |
          rm -rf dist-linux
          mkdir -p dist-linux/Axiom
          cp dist/Axiom packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/axiom.desktop packaging/linux/README.md dist-linux/Axiom/
          chmod +x dist-linux/Axiom/Axiom dist-linux/Axiom/install.sh dist-linux/Axiom/uninstall.sh
          tar -czf dist-linux/Axiom_Linux_x86_64_1.0.0-beta.tar.gz -C dist-linux Axiom
          cp dist-linux/Axiom_Linux_x86_64_1.0.0-beta.tar.gz dist-linux/Axiom_Linux_x86_64_Latest.tar.gz

      - name: Install launch and uninstall test
        run: |
          export HOME="$RUNNER_TEMP/axiom-home"
          mkdir -p "$HOME" "$RUNNER_TEMP/install-test"
          tar -xzf dist-linux/Axiom_Linux_x86_64_1.0.0-beta.tar.gz -C "$RUNNER_TEMP/install-test"
          cd "$RUNNER_TEMP/install-test/Axiom"
          ./install.sh
          test -x "$HOME/.local/share/axiom/Axiom"
          export AXIOM_DATA_DIR="$HOME/.axiom-test"
          export AXIOM_NO_BROWSER=1
          export AXIOM_PORT=5062
          "$HOME/.local/bin/axiom" > "$RUNNER_TEMP/installed-axiom.log" 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5062/health | grep -q '"Axiom"'; then ready=1; break; fi
            if ! kill -0 $pid 2>/dev/null; then cat "$RUNNER_TEMP/installed-axiom.log"; exit 1; fi
            sleep 1
          done
          test "$ready" = "1"
          curl -fsS http://127.0.0.1:5062/methods >/dev/null
          curl -fsS http://127.0.0.1:5062/payroll >/dev/null
          kill $pid
          wait $pid 2>/dev/null || true
          test -f "$AXIOM_DATA_DIR/axiom.db"
          ./uninstall.sh
          test -f "$AXIOM_DATA_DIR/axiom.db"
          test ! -e "$HOME/.local/share/axiom/Axiom"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-Linux-x86_64
          path: |
            dist-linux/Axiom_Linux_x86_64_1.0.0-beta.tar.gz
            dist-linux/Axiom_Linux_x86_64_Latest.tar.gz
          if-no-files-found: error

      - name: Publish stable Linux beta package
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: linux-beta-latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Axiom Linux Beta Latest" --notes "Latest tested Linux x86_64 beta package. User-local install; operational data preserved by normal uninstall." --prerelease
          gh release upload "$RELEASE_TAG" dist-linux/Axiom_Linux_x86_64_1.0.0-beta.tar.gz dist-linux/Axiom_Linux_x86_64_Latest.tar.gz --clobber
          stable="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Axiom_Linux_x86_64_Latest.tar.gz"
          curl -fL --retry 5 --retry-delay 2 --head "$stable"
