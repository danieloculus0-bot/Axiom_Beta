name: BEAN invents schedules - 9000 model-free learning episodes
on:
  push:
    branches: ['experiment/bean-iterative-scheduling-mutations-*']
    paths:
      - 'experiments/bean_iterative_search/**'
      - 'tests/test_bean_iterative_search.py'
      - '.github/workflows/bean-iterative-scheduling.yml'
  pull_request:
    paths:
      - 'experiments/bean_iterative_search/**'
      - 'tests/test_bean_iterative_search.py'
      - '.github/workflows/bean-iterative-scheduling.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 2f29b30a92e064c11c57c67d46eb4fdb2dcf4e71
          path: bean-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Inspect real BEAN Q, permutation integrity, budget fairness and cold holdout
        env:
          PYTHONPATH: bean-core
        run: python -m unittest discover -s tests -p test_bean_iterative_search.py -v
  full-evidence:
    needs: cross-platform
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 2f29b30a92e064c11c57c67d46eb4fdb2dcf4e71
          path: bean-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 3 x 3000 train and 3 x 400 unseen problems with equal 32-evaluation budgets
        env:
          PYTHONPATH: bean-core
        run: python experiments/bean_iterative_search/run.py --episodes 3000 --cases 400 --budget 32 --out iterative-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bean-iterative-9000-q-complete-paired-evidence
          path: iterative-evidence/
          if-no-files-found: warn
