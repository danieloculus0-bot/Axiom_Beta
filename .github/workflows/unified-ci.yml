name: Axiom Beta CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/engine.test.mjs web/ewi/engine.test.mjs web/erp/engine.test.mjs web/erp/pm.test.mjs web/erp/navigation.test.mjs web/erp/reports.test.mjs web/erp/context-actions.test.mjs web/erp/requests.test.mjs web/erp/routing-edit.test.mjs web/erp/workforce.test.mjs web/erp/qcdsm.test.mjs web/erp/routing-advice.test.mjs web/erp/routing-bean-adapter.test.mjs web/erp/routing-capacity-advice.test.mjs web/erp/pm-association-flow.test.mjs
      - run: node --check web/erp/app.mjs && node --check web/ewi/app.mjs && node --check web/erp/pm-view.mjs && node --check web/erp/navigation-ui.mjs && node --check web/erp/reports.mjs && node --check web/erp/context-ui.mjs && node --check web/erp/context-actions.mjs && node --check web/erp/request-view.mjs && node --check web/erp/requests.mjs && node --check web/erp/routing-edit.mjs && node --check web/erp/routing-view.mjs && node --check web/erp/workforce.mjs && node --check web/erp/workforce-view.mjs && node --check web/erp/qcdsm.mjs && node --check web/erp/qcdsm-view.mjs && node --check web/erp/routing-advice.mjs && node --check web/erp/routing-bean-adapter.mjs && node --check web/erp/routing-capacity-advice.mjs
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python web/erp/pm_association_browser.py
      - run: python -c "from superforge.app import create_app; a=create_app({'TESTING':True}); print(a.test_client().get('/health').get_json())"
