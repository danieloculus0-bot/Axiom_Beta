name: Axiom Beta CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -c "from superforge.app import create_app; a=create_app({'TESTING':True}); print(a.test_client().get('/health').get_json())"
